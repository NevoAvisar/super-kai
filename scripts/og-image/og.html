<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Heebo; src: url(heebo-he.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0590-05FF, U+20AA, U+FB1D-FB4F; }
  @font-face { font-family: Heebo; src: url(heebo-lat.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: Frank; src: url(frank-he.woff2) format("woff2"); font-weight: 300 900; unicode-range: U+0590-05FF, U+20AA, U+FB1D-FB4F; }
  @font-face { font-family: Frank; src: url(frank-lat.woff2) format("woff2"); font-weight: 300 900; }
  :root { --ink:#2b2622; --muted:#7a6f66; --cream:#faf6ef; --paper:#fffdf9; --brand:#b4532a; --brand-d:#9a4422; --leaf:#6b7740; --line:#ebe3d6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    position:relative; font-family:Heebo, sans-serif; color:var(--ink);
    background:
      radial-gradient(55% 75% at 26% 52%, rgba(180,83,42,.20), transparent 70%),
      radial-gradient(40% 50% at 95% 0%, rgba(107,119,64,.10), transparent 70%),
      var(--cream);
  }
  /* thin gold frame */
  .frame { position:absolute; inset:22px; border:1.5px solid rgba(180,83,42,.28); border-radius:30px; }
  .copy { position:absolute; right:84px; top:0; bottom:0; width:560px; display:flex; flex-direction:column; justify-content:center; gap:0; }
  .eyebrow { font-size:22px; font-weight:500; letter-spacing:.5px; color:var(--muted); display:flex; align-items:center; gap:14px; }
  .eyebrow::before { content:""; width:44px; height:2px; background:var(--brand); border-radius:2px; }
  .logo { font-family:Frank, serif; font-weight:900; font-size:132px; line-height:1.02; margin-top:14px; letter-spacing:-1px; }
  .logo span { color:var(--brand); }
  .tag { font-family:Frank, serif; font-weight:700; font-size:44px; line-height:1.15; margin-top:6px; }
  .rule { width:120px; height:3px; background:var(--brand); border-radius:3px; margin:30px 0 26px; }
  .points { display:flex; gap:8px; flex-wrap:nowrap; }
  .pill { font-size:19px; font-weight:600; padding:8px 14px; border-radius:999px; background:var(--paper); box-shadow:0 0 0 1.5px var(--line); white-space:nowrap; }
  .pill b { color:var(--leaf); font-weight:800; }
  .chef { margin-top:30px; display:flex; align-items:center; gap:14px; font-size:22px; color:var(--muted); }
  .chef i { font-style:normal; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:#f3d9cb; color:var(--ink); font-family:Frank, serif; font-weight:900; font-size:26px; }
  .chef strong { color:var(--ink); font-weight:700; }
  .stage { position:absolute; left:0; top:0; width:560px; height:630px; }
</style>
</head>
<body>
  <div class="frame"></div>

  <!-- Plated dish: slow-roasted honey-glazed carrots on tahini, pomegranate, herbs and pistachio -->
  <svg class="stage" viewBox="0 0 560 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="plate" cx="46%" cy="42%" r="62%">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".82" stop-color="#f6f1ea"/><stop offset="1" stop-color="#e6dccd"/>
      </radialGradient>
      <radialGradient id="well" cx="48%" cy="44%" r="60%">
        <stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#efe7db"/>
      </radialGradient>
      <radialGradient id="tahini" cx="45%" cy="40%" r="65%">
        <stop offset="0" stop-color="#f4e6cc"/><stop offset=".7" stop-color="#e9d3ad"/><stop offset="1" stop-color="#ddc195"/>
      </radialGradient>
      <linearGradient id="carrot" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6a04a"/><stop offset=".55" stop-color="#e2732e"/><stop offset="1" stop-color="#b9521c"/>
      </linearGradient>
      <linearGradient id="carrotP" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a24b8a"/><stop offset=".55" stop-color="#6f2560"/><stop offset="1" stop-color="#4a143f"/>
      </linearGradient>
      <linearGradient id="carrotY" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd36a"/><stop offset=".55" stop-color="#f0ac2e"/><stop offset="1" stop-color="#c98118"/>
      </linearGradient>
      <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff3d6" stop-opacity=".85"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#5a3a20" flood-opacity=".28"/>
      </filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6b3a12" flood-opacity=".35"/>
      </filter>
    </defs>

    <!-- pastel orbit arcs, as in the home-page carousel -->
    <g fill="none" stroke-linecap="round" transform="translate(286 318)">
      <circle r="248" stroke="#e7b9a2" stroke-width="3" stroke-dasharray="270 1290" transform="rotate(-40)"/>
      <circle r="278" stroke="#d9c7a3" stroke-width="2" stroke-dasharray="420 1330" transform="rotate(150)"/>
      <circle r="306" stroke="#c9cfae" stroke-width="1.6" stroke-dasharray="180 1740" transform="rotate(70)"/>
    </g>

    <g transform="translate(286 318)">
      <!-- plate -->
      <circle r="212" fill="url(#plate)" filter="url(#shadow)"/>
      <circle r="212" fill="none" stroke="#d9cdbb" stroke-width="1.2"/>
      <circle r="158" fill="url(#well)"/>
      <circle r="158" fill="none" stroke="#e4d9c8" stroke-width="1.5"/>

      <!-- tahini swoosh -->
      <path d="M-128,24 C-120,-70 -30,-122 52,-110 C128,-98 150,-20 128,40 C104,104 26,128 -40,112 C-96,98 -132,72 -128,24 Z" fill="url(#tahini)"/>
      <path d="M-104,30 C-94,-36 -26,-86 40,-80 C96,-74 116,-18 98,30" fill="none" stroke="#fff7e8" stroke-width="5" stroke-linecap="round" opacity=".7"/>

      <!-- roasted heritage carrots, fanned -->
      <g filter="url(#soft)">
        <g transform="translate(-6 -30) rotate(-34)"><path d="M-103.0,-17 C-36.05,-17.85 46.35,-9.350000000000001 103.0,-1.2 C106.0,0 106.0,0.6 103.0,1.2 C46.35,9.350000000000001 -36.05,17.85 -103.0,17 C-114.9,13.600000000000001 -114.9,-13.600000000000001 -103.0,-17 Z" fill="url(#carrotP)"/><g stroke="#00000033" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M-56.650000000000006,-12.718125000000002 q2,12.718125000000002 0,25.436250000000005" /><path d="M-15.45,-10.423125 q2,10.423125 0,20.84625" /><path d="M20.6,-8.415000000000001 q2,8.415000000000001 0,16.830000000000002" /><path d="M51.5,-6.6937500000000005 q2,6.6937500000000005 0,13.387500000000001" /></g><ellipse cx="-30.9" cy="-2.55" rx="15.3" ry="4.760000000000001" fill="#7a3210" opacity=".35"/><ellipse cx="25.75" cy="1.7000000000000002" rx="11.899999999999999" ry="3.74" fill="#7a3210" opacity=".3"/><path d="M-87.55,-9.350000000000001 C-30.9,-12.75 30.9,-7.65 77.25,-3.4000000000000004" stroke="#fff6e0" stroke-width="4.760000000000001" stroke-linecap="round" fill="none" opacity=".55"/></g>
        <g transform="translate(4 6) rotate(-14)"><path d="M-107.0,-18 C-37.449999999999996,-18.900000000000002 48.15,-9.9 107.0,-1.2 C110.0,0 110.0,0.6 107.0,1.2 C48.15,9.9 -37.449999999999996,18.900000000000002 -107.0,18 C-119.6,14.4 -119.6,-14.4 -107.0,-18 Z" fill="url(#carrot)"/><g stroke="#00000033" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M-58.85,-13.46625 q2,13.46625 0,26.9325" /><path d="M-16.05,-11.03625 q2,11.03625 0,22.0725" /><path d="M21.400000000000002,-8.91 q2,8.91 0,17.82" /><path d="M53.5,-7.0875 q2,7.0875 0,14.175" /></g><ellipse cx="-32.1" cy="-2.6999999999999997" rx="16.2" ry="5.040000000000001" fill="#7a3210" opacity=".35"/><ellipse cx="26.75" cy="1.8" rx="12.6" ry="3.96" fill="#7a3210" opacity=".3"/><path d="M-90.95,-9.9 C-32.1,-13.5 32.1,-8.1 80.25,-3.6" stroke="#fff6e0" stroke-width="5.040000000000001" stroke-linecap="round" fill="none" opacity=".55"/></g>
        <g transform="translate(-4 40) rotate(6)"><path d="M-98.0,-16 C-34.3,-16.8 44.1,-8.8 98.0,-1.2 C101.0,0 101.0,0.6 98.0,1.2 C44.1,8.8 -34.3,16.8 -98.0,16 C-109.2,12.8 -109.2,-12.8 -98.0,-16 Z" fill="url(#carrotY)"/><g stroke="#00000033" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M-53.900000000000006,-11.97 q2,11.97 0,23.94" /><path d="M-14.7,-9.81 q2,9.81 0,19.62" /><path d="M19.6,-7.920000000000001 q2,7.920000000000001 0,15.840000000000002" /><path d="M49.0,-6.3 q2,6.3 0,12.6" /></g><ellipse cx="-29.4" cy="-2.4" rx="14.4" ry="4.48" fill="#7a3210" opacity=".35"/><ellipse cx="24.5" cy="1.6" rx="11.2" ry="3.52" fill="#7a3210" opacity=".3"/><path d="M-83.3,-8.8 C-29.4,-12.0 29.4,-7.2 73.5,-3.2" stroke="#fff6e0" stroke-width="4.48" stroke-linecap="round" fill="none" opacity=".55"/></g>
        <g transform="translate(-10 70) rotate(24)"><path d="M-90.0,-15 C-31.499999999999996,-15.75 40.5,-8.25 90.0,-1.2 C93.0,0 93.0,0.6 90.0,1.2 C40.5,8.25 -31.499999999999996,15.75 -90.0,15 C-100.5,12.0 -100.5,-12.0 -90.0,-15 Z" fill="url(#carrot)"/><g stroke="#00000033" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M-49.50000000000001,-11.221875 q2,11.221875 0,22.44375" /><path d="M-13.5,-9.196875 q2,9.196875 0,18.39375" /><path d="M18.0,-7.425 q2,7.425 0,14.85" /><path d="M45.0,-5.90625 q2,5.90625 0,11.8125" /></g><ellipse cx="-27.0" cy="-2.25" rx="13.5" ry="4.2" fill="#7a3210" opacity=".35"/><ellipse cx="22.5" cy="1.5" rx="10.5" ry="3.3" fill="#7a3210" opacity=".3"/><path d="M-76.5,-8.25 C-27.0,-11.25 27.0,-6.75 67.5,-3.0" stroke="#fff6e0" stroke-width="4.2" stroke-linecap="round" fill="none" opacity=".55"/></g>
      </g>
      <!-- carrot tops -->
      <g stroke="#5f7a2e" stroke-width="3.2" stroke-linecap="round" fill="none">
        <path d="M-108,4 l-30,-22 M-110,8 l-36,-4 M-108,6 l-22,-34"/>
        <path d="M-96,54 l-34,-8 M-98,58 l-30,18 M-97,56 l-36,6"/>
      </g>

      <!-- honey drizzle -->
      <path d="M-96,-40 C-60,-20 -40,-60 -6,-30 S40,-10 70,-40 M-80,10 C-50,30 -20,-6 14,24 S60,40 84,14" fill="none" stroke="#c9741f" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>

      <!-- pomegranate seeds -->
      <g fill="#a8173b">
        <ellipse cx="-70" cy="74" rx="7" ry="8.5"/><ellipse cx="-52" cy="88" rx="6.5" ry="8"/><ellipse cx="20" cy="96" rx="7" ry="8.5"/>
        <ellipse cx="-110" cy="-6" rx="6.5" ry="8"/><ellipse cx="40" cy="-92" rx="7" ry="8.5"/><ellipse cx="-26" cy="-96" rx="6" ry="7.5"/>
        <ellipse cx="106" cy="54" rx="6.5" ry="8"/><ellipse cx="-4" cy="66" rx="6" ry="7.5"/>
      </g>
      <g fill="#ffd2dc" opacity=".8">
        <circle cx="-72" cy="71" r="2"/><circle cx="18" cy="93" r="2"/><circle cx="38" cy="-95" r="2"/><circle cx="104" cy="51" r="2"/><circle cx="-112" cy="-9" r="2"/>
      </g>

      <!-- pistachio crumbs -->
      <g fill="#8fa05a">
        <rect x="-40" y="70" width="9" height="6" rx="2" transform="rotate(20 -40 70)"/>
        <rect x="58" y="76" width="8" height="5" rx="2" transform="rotate(-30 58 76)"/>
        <rect x="-96" y="40" width="9" height="6" rx="2"/>
        <rect x="8" y="-74" width="8" height="5" rx="2" transform="rotate(40 8 -74)"/>
        <rect x="96" y="-14" width="9" height="6" rx="2" transform="rotate(-15 96 -14)"/>
      </g>

      <!-- herb leaves (mint / coriander) -->
      <g fill="#4f7a2a">
        <path d="M-58,-62 c14,-18 34,-16 40,-6 c-12,12 -30,14 -40,6 z"/>
        <path d="M-42,-70 c4,-20 22,-28 32,-20 c-6,14 -22,22 -32,20 z" fill="#6b9636"/>
        <path d="M40,58 c16,-14 36,-8 38,4 c-14,8 -30,8 -38,-4 z"/>
        <path d="M56,46 c8,-18 28,-20 34,-10 c-10,12 -26,16 -34,10 z" fill="#6b9636"/>
        <path d="M-108,58 c10,-16 28,-14 32,-4 c-10,10 -24,12 -32,4 z" fill="#6b9636"/>
      </g>
      <g stroke="#3d5f1f" stroke-width="1.2" fill="none" opacity=".6">
        <path d="M-56,-61 l34,-6"/><path d="M42,59 l34,0"/>
      </g>

      <!-- flaky salt -->
      <g fill="#ffffff" opacity=".95">
        <rect x="-20" y="-40" width="4" height="4" transform="rotate(30 -20 -40)"/><rect x="30" y="10" width="3.5" height="3.5"/>
        <rect x="-60" y="20" width="4" height="4" transform="rotate(15 -60 20)"/><rect x="0" y="40" width="3.5" height="3.5" transform="rotate(45 0 40)"/>
      </g>
    </g>

    <!-- a sprig beside the plate -->
    <g transform="translate(468 552) rotate(-24)">
      <path d="M0,0 C-20,-30 -30,-70 -24,-110" stroke="#4f7a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g fill="#6b9636">
        <path d="M-6,-20 c-20,-6 -30,-20 -24,-28 c14,2 24,14 24,28 z"/><path d="M-12,-46 c18,-10 34,-6 34,4 c-12,8 -26,6 -34,-4 z"/>
        <path d="M-20,-70 c-20,-8 -28,-22 -20,-30 c14,4 22,16 20,30 z"/><path d="M-22,-94 c16,-12 32,-10 34,0 c-12,8 -26,8 -34,0 z"/>
      </g>
    </g>
  </svg>

  <div class="copy">
    <p class="eyebrow">מעדנייה ביתית · אוכל מוכן</p>
    <h1 class="logo">סופר<span>-</span>קאי</h1>
    <p class="tag">מעדניית אוכל מוכן יוקרתי</p>
    <div class="rule"></div>
    <div class="points">
      <span class="pill">מבושל כל בוקר</span>
      <span class="pill">נמכר ברבעי קילו</span>
      <span class="pill">משלוח חינם מעל <b>150 ₪</b></span>
    </div>
    <p class="chef"><i>ק</i><span><strong>השף קאי</strong> · אוכל של בית, ברמה של מעדנייה</span></p>
  </div>
</body>
</html>
