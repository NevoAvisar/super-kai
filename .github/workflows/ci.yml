name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATALOG_SOURCE: mock # no database needed in CI
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (also runs prisma generate)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (pricing, 0.25 kg steps, delivery rules, catalog data)
        run: npm test

      - name: Production build
        run: npm run build
